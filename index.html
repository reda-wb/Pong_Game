<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pong Game - Classic Arcade</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            font-family: 'Courier New', monospace;
        }
        
        #gameCanvas {
            display: block;
            background: #000;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.5);
        }
        
        .glow {
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.8);
        }
        
        .button-glow {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.6);
            transition: all 0.3s ease;
        }
        
        .button-glow:hover {
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.9);
            transform: scale(1.05);
        }
        
        .powerup-display {
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }
        
        .touch-control {
            position: fixed;
            width: 45%;
            height: 50vh;
            background: rgba(59, 130, 246, 0.1);
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 10px;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: rgba(59, 130, 246, 0.5);
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        
        .touch-control.active {
            background: rgba(59, 130, 246, 0.3);
            border-color: rgba(59, 130, 246, 0.6);
        }
        
        @media (max-width: 768px) {
            #gameCanvas {
                max-width: 100%;
                height: auto;
            }
            
            .touch-control {
                display: flex;
            }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="container mx-auto px-4">
        <!-- Game Menu -->
        <div id="menu" class="text-center">
            <h1 class="text-6xl font-bold text-blue-400 mb-8 glow">PONG</h1>
            <div class="bg-slate-800 p-8 rounded-lg max-w-md mx-auto border-2 border-blue-500">
                <h2 class="text-2xl text-white mb-6">Select Game Mode</h2>
                <div class="space-y-4">
                    <button id="singlePlayerBtn" class="button-glow w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg">
                        Single Player (vs AI)
                    </button>
                    <button id="multiPlayerBtn" class="button-glow w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg">
                        Two Players (Local)
                    </button>
                </div>
                
                <div id="difficultySelect" class="mt-6 hidden">
                    <h3 class="text-xl text-white mb-4">Select Difficulty</h3>
                    <div class="space-y-3">
                        <button class="difficulty-btn button-glow w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded" data-difficulty="easy">
                            Easy
                        </button>
                        <button class="difficulty-btn button-glow w-full bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-2 px-4 rounded" data-difficulty="medium">
                            Medium
                        </button>
                        <button class="difficulty-btn button-glow w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded" data-difficulty="hard">
                            Hard
                        </button>
                    </div>
                </div>
                
                <div class="mt-6 text-left text-gray-300 text-sm">
                    <h3 class="font-bold mb-2">Controls:</h3>
                    <p>Player 1: ↑/↓ arrow keys</p>
                    <p>Player 2: W/S keys</p>
                    <p class="mt-2 text-yellow-400">Power-ups appear randomly!</p>
                </div>
            </div>
        </div>
        
        <!-- Game Canvas -->
        <div id="gameContainer" class="hidden text-center">
            <div class="mb-4 flex justify-between items-center max-w-4xl mx-auto">
                <div class="text-left">
                    <div class="text-4xl font-bold text-blue-400 glow" id="player1Score">0</div>
                    <div class="text-sm text-gray-400">Player 1</div>
                    <div id="p1PowerUp" class="text-xs text-yellow-400 mt-1"></div>
                </div>
                <div class="text-center">
                    <div class="text-sm text-gray-400" id="gameMode">Single Player</div>
                    <div class="text-xs text-gray-500" id="difficulty"></div>
                    <button id="pauseBtn" class="mt-2 bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-1 px-4 rounded text-sm">
                        Pause
                    </button>
                </div>
                <div class="text-right">
                    <div class="text-4xl font-bold text-red-400 glow" id="player2Score">0</div>
                    <div class="text-sm text-gray-400" id="player2Label">AI</div>
                    <div id="p2PowerUp" class="text-xs text-yellow-400 mt-1"></div>
                </div>
            </div>
            <canvas id="gameCanvas" width="800" height="600"></canvas>
            <div class="mt-4">
                <button id="backToMenuBtn" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-6 rounded">
                    Back to Menu
                </button>
            </div>
        </div>
        
        <!-- Pause Menu -->
        <div id="pauseMenu" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center">
            <div class="bg-slate-800 p-8 rounded-lg border-2 border-blue-500">
                <h2 class="text-3xl text-white mb-6 glow">PAUSED</h2>
                <div class="space-y-4">
                    <button id="resumeBtn" class="button-glow w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg">
                        Resume
                    </button>
                    <button id="restartBtn" class="button-glow w-full bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-3 px-6 rounded-lg">
                        Restart
                    </button>
                    <button id="quitBtn" class="button-glow w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-lg">
                        Quit to Menu
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Mobile Touch Controls -->
    <div id="touchControlLeft" class="touch-control" style="left: 2%; bottom: 25%;">
        <div>
            <div style="text-align: center;">↑</div>
            <div style="text-align: center; margin-top: 20px;">↓</div>
        </div>
    </div>
    <div id="touchControlRight" class="touch-control" style="right: 2%; bottom: 25%;">
        <div>
            <div style="text-align: center;">↑</div>
            <div style="text-align: center; margin-top: 20px;">↓</div>
        </div>
    </div>

    <script>
        // Game Constants
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Audio Setup
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        let backgroundMusic = null;
        let musicPlaying = false;
        
        // Sound effect generator
        function playSound(frequency, duration, type = 'sine') {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = frequency;
            oscillator.type = type;
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration);
        }
        
        function playPaddleHit() {
            playSound(220, 0.1, 'square');
        }
        
        function playWallHit() {
            playSound(180, 0.1, 'triangle');
        }
        
        function playScore() {
            playSound(100, 0.3, 'sawtooth');
            setTimeout(() => playSound(150, 0.2, 'sawtooth'), 100);
        }
        
        function playPowerUp() {
            playSound(440, 0.1, 'sine');
            setTimeout(() => playSound(550, 0.1, 'sine'), 50);
            setTimeout(() => playSound(660, 0.15, 'sine'), 100);
        }
        
        // Background music (simple melody loop)
        function startBackgroundMusic() {
            if (musicPlaying) return;
            musicPlaying = true;
            playBackgroundMelody();
        }
        
        function playBackgroundMelody() {
            if (!musicPlaying || !gameState.running) return;
            
            const notes = [262, 294, 330, 349, 392, 440, 494, 523]; // C major scale
            const pattern = [0, 2, 4, 2, 0, 2, 4, 2, 4, 5, 7, 4, 5, 7];
            let noteIndex = 0;
            
            function playNote() {
                if (!musicPlaying || !gameState.running) return;
                
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = notes[pattern[noteIndex % pattern.length]];
                oscillator.type = 'triangle';
                
                gainNode.gain.setValueAtTime(0.05, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.3);
                
                noteIndex++;
                setTimeout(playNote, 400);
            }
            
            playNote();
        }
        
        function stopBackgroundMusic() {
            musicPlaying = false;
        }
        
        // Game State
        let gameState = {
            mode: null, // 'single' or 'multi'
            difficulty: null,
            paused: false,
            running: false,
            animationId: null
        };
        
        // Paddle Configuration
        const PADDLE_WIDTH = 10;
        const PADDLE_HEIGHT = 100;
        const PADDLE_SPEED = 6;
        
        // Ball Configuration
        const BALL_SIZE = 10;
        const INITIAL_BALL_SPEED = 5;
        const MAX_BALL_SPEED = 12;
        
        // Power-up Configuration
        const POWERUP_SIZE = 15;
        const POWERUP_DURATION = 5000; // 5 seconds
        const POWERUP_SPAWN_INTERVAL = 10000; // Every 10 seconds
        
        // Game Objects
        let player1 = {
            x: 20,
            y: canvas.height / 2 - PADDLE_HEIGHT / 2,
            width: PADDLE_WIDTH,
            height: PADDLE_HEIGHT,
            dy: 0,
            score: 0,
            powerUp: null,
            powerUpEnd: 0
        };
        
        let player2 = {
            x: canvas.width - 20 - PADDLE_WIDTH,
            y: canvas.height / 2 - PADDLE_HEIGHT / 2,
            width: PADDLE_WIDTH,
            height: PADDLE_HEIGHT,
            dy: 0,
            score: 0,
            powerUp: null,
            powerUpEnd: 0
        };
        
        let ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            dx: INITIAL_BALL_SPEED,
            dy: INITIAL_BALL_SPEED,
            size: BALL_SIZE,
            speed: INITIAL_BALL_SPEED
        };
        
        let powerUps = [];
        let lastPowerUpSpawn = 0;
        let particles = [];
        
        // Input Handling
        let keys = {};
        
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });
        
        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        // AI Configuration
        const AI_CONFIG = {
            easy: { speed: 0.5, reactionDelay: 200, errorMargin: 40 },
            medium: { speed: 0.7, reactionDelay: 100, errorMargin: 20 },
            hard: { speed: 0.95, reactionDelay: 50, errorMargin: 5 }
        };
        
        let aiLastUpdate = 0;
        let aiTargetY = canvas.height / 2;
        
        // Menu Event Listeners
        document.getElementById('singlePlayerBtn').addEventListener('click', () => {
            document.getElementById('difficultySelect').classList.remove('hidden');
        });
        
        document.getElementById('multiPlayerBtn').addEventListener('click', () => {
            startGame('multi', null);
        });
        
        document.querySelectorAll('.difficulty-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const difficulty = e.target.dataset.difficulty;
                startGame('single', difficulty);
            });
        });
        
        document.getElementById('pauseBtn').addEventListener('click', togglePause);
        document.getElementById('resumeBtn').addEventListener('click', togglePause);
        document.getElementById('restartBtn').addEventListener('click', restartGame);
        document.getElementById('quitBtn').addEventListener('click', quitToMenu);
        document.getElementById('backToMenuBtn').addEventListener('click', quitToMenu);
        
        // Game Functions
        function startGame(mode, difficulty) {
            gameState.mode = mode;
            gameState.difficulty = difficulty;
            gameState.paused = false;
            gameState.running = true;
            
            // Reset game objects
            resetGame();
            
            // Update UI
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('gameContainer').classList.remove('hidden');
            document.getElementById('gameMode').textContent = mode === 'single' ? 'Single Player' : 'Two Players';
            document.getElementById('player2Label').textContent = mode === 'single' ? 'AI' : 'Player 2';
            document.getElementById('difficulty').textContent = difficulty ? `Difficulty: ${difficulty.toUpperCase()}` : '';
            
            // Start game loop
            lastPowerUpSpawn = Date.now();
            startBackgroundMusic();
            gameLoop();
        }
        
        function resetGame() {
            player1.y = canvas.height / 2 - PADDLE_HEIGHT / 2;
            player1.score = 0;
            player1.height = PADDLE_HEIGHT;
            player1.powerUp = null;
            
            player2.y = canvas.height / 2 - PADDLE_HEIGHT / 2;
            player2.score = 0;
            player2.height = PADDLE_HEIGHT;
            player2.powerUp = null;
            
            resetBall();
            powerUps = [];
            particles = [];
            
            updateScores();
        }
        
        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.speed = INITIAL_BALL_SPEED;
            
            // Random direction
            const angle = (Math.random() * Math.PI / 3) - Math.PI / 6; // -30 to 30 degrees
            const direction = Math.random() < 0.5 ? 1 : -1;
            ball.dx = Math.cos(angle) * ball.speed * direction;
            ball.dy = Math.sin(angle) * ball.speed;
        }
        
        function togglePause() {
            gameState.paused = !gameState.paused;
            document.getElementById('pauseMenu').classList.toggle('hidden');
        }
        
        function restartGame() {
            gameState.paused = false;
            document.getElementById('pauseMenu').classList.add('hidden');
            resetGame();
        }
        
        function quitToMenu() {
            gameState.running = false;
            gameState.paused = false;
            stopBackgroundMusic();
            if (gameState.animationId) {
                cancelAnimationFrame(gameState.animationId);
            }
            document.getElementById('gameContainer').classList.add('hidden');
            document.getElementById('pauseMenu').classList.add('hidden');
            document.getElementById('menu').classList.remove('hidden');
            document.getElementById('difficultySelect').classList.add('hidden');
        }
        
        function updateScores() {
            document.getElementById('player1Score').textContent = player1.score;
            document.getElementById('player2Score').textContent = player2.score;
        }
        
        function updatePowerUpDisplay() {
            const p1Display = document.getElementById('p1PowerUp');
            const p2Display = document.getElementById('p2PowerUp');
            
            p1Display.textContent = player1.powerUp ? `⚡ ${player1.powerUp.toUpperCase()}` : '';
            p2Display.textContent = player2.powerUp ? `⚡ ${player2.powerUp.toUpperCase()}` : '';
        }
        
        function spawnPowerUp() {
            const types = ['speed', 'size'];
            const type = types[Math.floor(Math.random() * types.length)];
            
            powerUps.push({
                x: Math.random() * (canvas.width - 200) + 100,
                y: Math.random() * (canvas.height - 100) + 50,
                size: POWERUP_SIZE,
                type: type,
                rotation: 0
            });
        }
        
        function applyPowerUp(player, type) {
            player.powerUp = type;
            player.powerUpEnd = Date.now() + POWERUP_DURATION;
            
            if (type === 'size') {
                player.height = PADDLE_HEIGHT * 1.5;
            }
            
            updatePowerUpDisplay();
        }
        
        function checkPowerUpExpiry(player) {
            if (player.powerUp && Date.now() > player.powerUpEnd) {
                if (player.powerUp === 'size') {
                    player.height = PADDLE_HEIGHT;
                }
                player.powerUp = null;
                updatePowerUpDisplay();
            }
        }
        
        function createParticles(x, y, color, count = 10) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    dx: (Math.random() - 0.5) * 8,
                    dy: (Math.random() - 0.5) * 8,
                    size: Math.random() * 4 + 2,
                    color: color,
                    life: 1.0
                });
            }
        }
        
        function updateAI() {
            const now = Date.now();
            const config = AI_CONFIG[gameState.difficulty];
            
            if (now - aiLastUpdate > config.reactionDelay) {
                aiLastUpdate = now;
                
                // Predict ball position with error margin
                const errorOffset = (Math.random() - 0.5) * config.errorMargin;
                aiTargetY = ball.y + errorOffset;
            }
            
            // Move towards target
            const paddleCenter = player2.y + player2.height / 2;
            const diff = aiTargetY - paddleCenter;
            
            if (Math.abs(diff) > 5) {
                player2.dy = Math.sign(diff) * PADDLE_SPEED * config.speed;
            } else {
                player2.dy = 0;
            }
        }
        
        function updatePaddles() {
            // Player 1 controls (Arrow Keys)
            if (keys['ArrowUp']) {
                player1.dy = -PADDLE_SPEED;
            } else if (keys['ArrowDown']) {
                player1.dy = PADDLE_SPEED;
            } else {
                player1.dy = 0;
            }
            
            // Player 2 or AI controls (W/S Keys)
            if (gameState.mode === 'multi') {
                if (keys['w'] || keys['W']) {
                    player2.dy = -PADDLE_SPEED;
                } else if (keys['s'] || keys['S']) {
                    player2.dy = PADDLE_SPEED;
                } else {
                    player2.dy = 0;
                }
            } else {
                updateAI();
            }
            
            // Update positions
            player1.y += player1.dy;
            player2.y += player2.dy;
            
            // Boundaries
            player1.y = Math.max(0, Math.min(canvas.height - player1.height, player1.y));
            player2.y = Math.max(0, Math.min(canvas.height - player2.height, player2.y));
            
            // Check power-up expiry
            checkPowerUpExpiry(player1);
            checkPowerUpExpiry(player2);
        }
        
        function updateBall() {
            ball.x += ball.dx;
            ball.y += ball.dy;
            
            // Top and bottom collision
            if (ball.y <= 0 || ball.y >= canvas.height) {
                ball.dy = -ball.dy;
                playWallHit();
                createParticles(ball.x, ball.y, '#3b82f6', 5);
            }
            
            // Paddle collision
            function checkPaddleCollision(paddle, isPlayer1) {
                if (ball.x - ball.size < paddle.x + paddle.width &&
                    ball.x + ball.size > paddle.x &&
                    ball.y + ball.size > paddle.y &&
                    ball.y - ball.size < paddle.y + paddle.height) {
                    
                    // Calculate hit position on paddle (-1 to 1)
                    const hitPos = ((ball.y - (paddle.y + paddle.height / 2)) / (paddle.height / 2));
                    
                    // Adjust angle based on hit position
                    const maxAngle = Math.PI / 3; // 60 degrees
                    const angle = hitPos * maxAngle;
                    
                    // Increase speed slightly
                    ball.speed = Math.min(ball.speed + 0.3, MAX_BALL_SPEED);
                    
                    // Apply speed boost power-up
                    const speedMultiplier = paddle.powerUp === 'speed' ? 1.5 : 1;
                    
                    ball.dx = Math.cos(angle) * ball.speed * (isPlayer1 ? 1 : -1) * speedMultiplier;
                    ball.dy = Math.sin(angle) * ball.speed * speedMultiplier;
                    
                    // Move ball outside paddle to prevent double collision
                    if (isPlayer1) {
                        ball.x = paddle.x + paddle.width + ball.size;
                    } else {
                        ball.x = paddle.x - ball.size;
                    }
                    
                    playPaddleHit();
                    createParticles(ball.x, ball.y, '#fbbf24', 8);
                    return true;
                }
                return false;
            }
            
            checkPaddleCollision(player1, true);
            checkPaddleCollision(player2, false);
            
            // Score detection
            if (ball.x < 0) {
                player2.score++;
                updateScores();
                playScore();
                createParticles(ball.x, ball.y, '#ef4444', 15);
                resetBall();
            } else if (ball.x > canvas.width) {
                player1.score++;
                updateScores();
                playScore();
                createParticles(ball.x, ball.y, '#3b82f6', 15);
                resetBall();
            }
        }
        
        function updatePowerUps() {
            const now = Date.now();
            
            // Spawn new power-up
            if (now - lastPowerUpSpawn > POWERUP_SPAWN_INTERVAL && powerUps.length < 2) {
                spawnPowerUp();
                lastPowerUpSpawn = now;
            }
            
            // Update existing power-ups
            powerUps.forEach(powerUp => {
                powerUp.rotation += 0.05;
                
                // Check collision with ball
                const dist = Math.sqrt(
                    Math.pow(ball.x - powerUp.x, 2) + 
                    Math.pow(ball.y - powerUp.y, 2)
                );
                
                if (dist < ball.size + powerUp.size) {
                    // Determine which player gets it based on ball direction
                    const player = ball.dx < 0 ? player1 : player2;
                    applyPowerUp(player, powerUp.type);
                    playPowerUp();
                    createParticles(powerUp.x, powerUp.y, '#fbbf24', 12);
                    powerUp.collected = true;
                }
            });
            
            // Remove collected power-ups
            powerUps = powerUps.filter(p => !p.collected);
        }
        
        function updateParticles() {
            particles.forEach(particle => {
                particle.x += particle.dx;
                particle.y += particle.dy;
                particle.life -= 0.02;
                particle.size *= 0.95;
            });
            
            particles = particles.filter(p => p.life > 0);
        }
        
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw center line
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Draw paddles
            function drawPaddle(paddle, color) {
                ctx.fillStyle = color;
                ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
                
                // Glow effect
                ctx.shadowBlur = 15;
                ctx.shadowColor = color;
                ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
                ctx.shadowBlur = 0;
            }
            
            drawPaddle(player1, player1.powerUp ? '#fbbf24' : '#3b82f6');
            drawPaddle(player2, player2.powerUp ? '#fbbf24' : '#ef4444');
            
            // Draw ball
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#fff';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Draw power-ups
            powerUps.forEach(powerUp => {
                ctx.save();
                ctx.translate(powerUp.x, powerUp.y);
                ctx.rotate(powerUp.rotation);
                
                if (powerUp.type === 'speed') {
                    // Lightning bolt
                    ctx.fillStyle = '#fbbf24';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#fbbf24';
                    ctx.beginPath();
                    ctx.moveTo(0, -powerUp.size);
                    ctx.lineTo(powerUp.size / 3, 0);
                    ctx.lineTo(0, 0);
                    ctx.lineTo(powerUp.size / 2, powerUp.size);
                    ctx.lineTo(0, powerUp.size / 3);
                    ctx.lineTo(-powerUp.size / 3, 0);
                    ctx.closePath();
                    ctx.fill();
                } else {
                    // Plus sign for size
                    ctx.fillStyle = '#10b981';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#10b981';
                    ctx.fillRect(-powerUp.size / 5, -powerUp.size, powerUp.size / 2.5, powerUp.size * 2);
                    ctx.fillRect(-powerUp.size, -powerUp.size / 5, powerUp.size * 2, powerUp.size / 2.5);
                }
                
                ctx.shadowBlur = 0;
                ctx.restore();
            });
            
            // Draw particles
            particles.forEach(particle => {
                ctx.globalAlpha = particle.life;
                ctx.fillStyle = particle.color;
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }
        
        function gameLoop() {
            if (!gameState.running) return;
            
            if (!gameState.paused) {
                updatePaddles();
                updateBall();
                updatePowerUps();
                updateParticles();
                draw();
            } else {
                draw(); // Still draw when paused
            }
            
            gameState.animationId = requestAnimationFrame(gameLoop);
        }
        
        // Pause with Escape key
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && gameState.running) {
                togglePause();
            }
        });
        
        // Mobile Touch Controls
        const touchControlLeft = document.getElementById('touchControlLeft');
        const touchControlRight = document.getElementById('touchControlRight');
        
        let touchStates = {
            leftUp: false,
            leftDown: false,
            rightUp: false,
            rightDown: false
        };
        
        // Responsive canvas sizing
        function resizeCanvas() {
            const maxWidth = window.innerWidth - 40;
            const maxHeight = window.innerHeight - 250;
            const aspectRatio = 800 / 600;
            
            let newWidth = 800;
            let newHeight = 600;
            
            if (maxWidth < 800) {
                newWidth = maxWidth;
                newHeight = newWidth / aspectRatio;
            }
            
            if (newHeight > maxHeight) {
                newHeight = maxHeight;
                newWidth = newHeight * aspectRatio;
            }
            
            canvas.style.width = newWidth + 'px';
            canvas.style.height = newHeight + 'px';
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        // Handle touch events for left control
        function handleTouchStart(e, control, upKey, downKey) {
            e.preventDefault();
            const rect = control.getBoundingClientRect();
            const touches = e.touches;
            
            for (let i = 0; i < touches.length; i++) {
                const touch = touches[i];
                const y = touch.clientY - rect.top;
                const midpoint = rect.height / 2;
                
                if (y < midpoint) {
                    keys[upKey] = true;
                    touchStates[control.id === 'touchControlLeft' ? 'leftUp' : 'rightUp'] = true;
                } else {
                    keys[downKey] = true;
                    touchStates[control.id === 'touchControlLeft' ? 'leftDown' : 'rightDown'] = true;
                }
            }
            control.classList.add('active');
        }
        
        function handleTouchEnd(e, control, upKey, downKey) {
            e.preventDefault();
            keys[upKey] = false;
            keys[downKey] = false;
            if (control.id === 'touchControlLeft') {
                touchStates.leftUp = false;
                touchStates.leftDown = false;
            } else {
                touchStates.rightUp = false;
                touchStates.rightDown = false;
            }
            control.classList.remove('active');
        }
        
        function handleTouchMove(e, control, upKey, downKey) {
            e.preventDefault();
            const rect = control.getBoundingClientRect();
            const touches = e.touches;
            
            // Reset states
            keys[upKey] = false;
            keys[downKey] = false;
            
            for (let i = 0; i < touches.length; i++) {
                const touch = touches[i];
                const x = touch.clientX;
                const y = touch.clientY;
                
                // Check if touch is still within control bounds
                if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
                    const localY = y - rect.top;
                    const midpoint = rect.height / 2;
                    
                    if (localY < midpoint) {
                        keys[upKey] = true;
                    } else {
                        keys[downKey] = true;
                    }
                }
            }
        }
        
        // Left control (Player 1)
        touchControlLeft.addEventListener('touchstart', (e) => {
            handleTouchStart(e, touchControlLeft, 'ArrowUp', 'ArrowDown');
        });
        
        touchControlLeft.addEventListener('touchend', (e) => {
            handleTouchEnd(e, touchControlLeft, 'ArrowUp', 'ArrowDown');
        });
        
        touchControlLeft.addEventListener('touchmove', (e) => {
            handleTouchMove(e, touchControlLeft, 'ArrowUp', 'ArrowDown');
        });
        
        // Right control (Player 2)
        touchControlRight.addEventListener('touchstart', (e) => {
            handleTouchStart(e, touchControlRight, 'W', 'S');
        });
        
        touchControlRight.addEventListener('touchend', (e) => {
            handleTouchEnd(e, touchControlRight, 'W', 'S');
        });
        
        touchControlRight.addEventListener('touchmove', (e) => {
            handleTouchMove(e, touchControlRight, 'W', 'S');
        });
        
        // Prevent default touch behavior on the entire document
        document.addEventListener('touchmove', (e) => {
            if (gameState.running) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
